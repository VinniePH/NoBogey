name: Deploy landing page

on:
  push:
    branches: [main]
    paths:
      - "apps/landing-page/**"
      - "apps/admin-web/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/landing-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: landing-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @nobogey/landing-page build
      - run: pnpm --filter @nobogey/admin-web build
      - name: Add the admin portal to the site artifact
        shell: bash
        run: |
          mkdir -p apps/landing-page/dist/admin-assets
          cp -R apps/admin-web/dist/. apps/landing-page/dist/admin-assets/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/landing-page/dist
      - id: deployment
        uses: actions/deploy-pages@v4
