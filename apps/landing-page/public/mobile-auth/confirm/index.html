<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <meta content="noindex, nofollow" name="robots" />
    <meta content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" http-equiv="Content-Security-Policy" />
    <meta content="no-referrer" name="referrer" />
    <title>Confirm your NoBogey account</title>
    <link href="../auth-callback.css" rel="stylesheet" />
  </head>
  <body data-deep-link="nobogey://auth/callback">
    <main class="card">
      <p class="brand">NoBogey</p>
      <h1>Continue in the NoBogey app</h1>
      <p>Your email has been verified. Open NoBogey to finish signing in.</p>
      <a class="button" data-open-app href="nobogey://auth/callback">Open NoBogey</a>
      <a class="support" href="/contact/">Need help? Contact NoBogey support</a>
    </main>
    <script defer src="../open-app.js"></script>
  </body>
</html>
